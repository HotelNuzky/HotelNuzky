<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Vzdálená Recepce</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #1f2228, #2d323b); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            width: 90%;
            max-width: 750px;
            text-align: center;
            padding: 30px;
            position: relative;
        }

        /* Jazyková lišta vpravo nahoře */
        .lang-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        .lang-flag {
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            filter: grayscale(40%);
        }
        .lang-flag.active {
            filter: grayscale(0%);
            transform: scale(1.2);
        }
        
        .header-title {
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a0aab8;
            margin-bottom: 40px;
            font-weight: 600;
        }

        /* Mřížka hlavního menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            width: 100%;
        }

        /* Styl 3D tlačítek pro hlavní menu */
        .btn-main {
            color: white;
            border: none;
            padding: 40px 20px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 1.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-main svg {
            width: 54px;
            height: 54px;
            fill: currentColor;
            transition: transform 0.2s;
        }
        .btn-main:active {
            transform: translateY(8px);
        }

        /* Barevné varianty tlačítek */
        .btn-green {
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
            border-top: 2px solid #4caf50;
            box-shadow: 0 12px 0 #0f4012, 0 15px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-green:active { box-shadow: 0 4px 0 #0f4012, 0 6px 10px rgba(0, 0, 0, 0.5); }

        .btn-red {
            background: linear-gradient(180deg, #c62828 0%, #8e1c1c 100%);
            border-top: 2px solid #ef5350;
            box-shadow: 0 12px 0 #5c1010, 0 15px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-red:active { box-shadow: 0 4px 0 #5c1010, 0 6px 10px rgba(0, 0, 0, 0.5); }

        .btn-yellow {
            background: linear-gradient(180deg, #fbc02d 0%, #f57f17 100%);
            color: #000000;
            border-top: 2px solid #fff176;
            box-shadow: 0 12px 0 #bc6400, 0 15px 25px rgba(0, 0, 0, 0.5);
            text-shadow: none;
        }
        .btn-yellow:active { box-shadow: 0 4px 0 #bc6400, 0 6px 10px rgba(0, 0, 0, 0.5); }

        .btn-blue {
            background: linear-gradient(180deg, #1565c0 0%, #0d47a1 100%);
            border-top: 2px solid #42a5f5;
            box-shadow: 0 12px 0 #082d6b, 0 15px 25px rgba(0, 0, 0, 0.5);
        }
        .btn-blue:active { box-shadow: 0 4px 0 #082d6b, 0 6px 10px rgba(0, 0, 0, 0.5); }

        /* Formulářová karta */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            margin-top: 40px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-label {
            font-size: 16px;
            color: #a0aab8;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, textarea {
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            font-size: 22px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea {
            font-size: 18px;
            resize: none;
            height: 120px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            border-color: #4caf50;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Spodní tlačítka ve formulářích */
        .button-row {
            display: flex;
            gap: 20px;
            margin-top: 35px;
        }
        .btn-form-submit {
            flex: 2;
            background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            padding: 22px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0f4012, 0 8px 15px rgba(0,0,0,0.3);
            border-top: 1px solid #4caf50;
            transition: all 0.1s ease;
        }
        .btn-form-submit:active {
            box-shadow: 0 2px 0 #0f4012, 0 3px 6px rgba(0,0,0,0.3);
            transform: translateY(4px);
        }
        .btn-form-submit:disabled {
            background: #555 !important;
            border-top: none !important;
            box-shadow: none !important;
            opacity: 0.6;
        }
        .btn-form-cancel {
            flex: 1;
            background: linear-gradient(180deg, #5a6268 0%, #343a40 100%);
            color: #e0e0e0;
            border: none;
            padding: 22px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 0 #212529, 0 8px 15px rgba(0,0,0,0.3);
            border-top: 1px solid #6c757d;
            transition: all 0.1s ease;
        }
        .btn-form-cancel:active {
            box-shadow: 0 2px 0 #212529, 0 3px 6px rgba(0,0,0,0.3);
            transform: translateY(4px);
        }

        /* Poděkování */
        .thanks-box { padding: 40px 20px; }
        .thanks-icon svg { width: 74px; height: 74px; margin-bottom: 20px; }
        .thanks-msg { font-size: 22px; color: #c0caf0; margin: 12px 0; line-height: 1.5; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- JAZYKOVÁ LIŠTA (Vlaječky) -->
    <div class="lang-bar">
        <span class="lang-flag active" onclick="setLanguage('en')" id="flag-en">🇬🇧</span>
        <span class="lang-flag" onclick="setLanguage('cs')" id="flag-cs">🇨🇿</span>
        <span class="lang-flag" onclick="setLanguage('de')" id="flag-de">🇩🇪</span>
        <span class="lang-flag" onclick="setLanguage('pl')" id="flag-pl">🇵🇱</span>
        <span class="lang-flag" onclick="setLanguage('it')" id="flag-it">🇮🇹</span>
        <span class="lang-flag" onclick="setLanguage('fr')" id="flag-fr">🇫🇷</span>
        <span class="lang-flag" onclick="setLanguage('uk')" id="flag-uk">🇺🇦</span>
    </div>

    <div class="container">
        
        <!-- OBRAZOVKA 1: Hlavní Menu (4 Tlačítka) -->
        <div id="screen-1">
            <div class="header-title" id="main-title">Kiosk</div>
            <div class="menu-grid">
                <button class="btn-main btn-green" onclick="alert('Check-in se zatím neřeší.')">
                    <svg viewBox="0 0 24 24"><path d="M12.65 11.7c-.56-.16-1.18-.04-1.64.33l-2.61 2.1c-.26.21-.61.27-.92.16l-2-.68a1.003 1.003 0 0 0-1.28.77l-.46 2.45c-.07.36.06.73.33.95l1.83 1.48c.26.21.61.26.92.13l2.25-.9c.32-.13.53-.44.53-.78V18.1c0-.42.31-.79.73-.84l2.12-.27c.43-.05.77-.38.83-.81l.36-2.5c.03-.41-.2-.79-.59-.98zM22 6.5V19c0 1.1-.9 2-2 2H9v-2h11V6.5l-5-5L10.4 6H7.6L12 1.5c.6-.6 1.4-.9 2.2-.9h.6c.8 0 1.6.3 2.2.9l5 5c.6.6.9 1.4.9 2.2z"/></svg>
                    <span>CHECK-IN</span>
                </button>
                <button class="btn-main btn-red" onclick="goToForm('checkout')">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v3h-2v-3H7v-2h4V8h2v3h4v2z"/></svg>
                    <span>CHECK-OUT</span>
                </button>
                <button class="btn-main btn-yellow" onclick="goToForm('service')">
                    <svg viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L7.6 4.7 4.7 7.6 1.7 4.6C.6 7 .9 10 3 12c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.4-.4.4-1.1 0-1.4z"/></svg>
                    <span style="font-size: 22px;" id="btn-label-service">SERVICE / HELP</span>
                </button>
                <button class="btn-main btn-blue" onclick="alert('Parkování se zatím neřeší.')">
                     <!-- OBRAZOVKA 2: Formulář -->
        <div id="screen-2" class="card hidden">
            <div class="input-group">
                <label class="input-label" id="lbl-room">Room / Pokoj</label>
                <input type="text" id="roomInput" placeholder="e.g. 102" inputmode="numeric">
            </div>

            <!-- Pole pro Check-out (Jméno) -->
            <div class="input-group" id="group-name">
                <label class="input-label" id="lbl-name">Name / Jméno</label>
                <input type="text" id="nameInput" placeholder="e.g. John Smith">
            </div>

            <!-- Pole pro Opravy / Otázky (Popis problému) -->
            <div class="input-group hidden" id="group-desc">
                <label class="input-label" id="lbl-desc">Description / Popis problému</label>
                <textarea id="descInput" placeholder="..."></textarea>
            </div>

            <div class="button-row">
                <button class="btn-form-cancel" id="btn-cancel" onclick="resetToStart()">CANCEL</button>
                <button class="btn-form-submit" id="submitBtn" onclick="submitForm()">SEND</button>
            </div>
        </div>

        <!-- OBRAZOVKA 3: Potvrzení -->
        <div id="screen-3" class="card hidden thanks-box">
            <div class="thanks-icon" id="status-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <div class="thanks-msg" id="thanks-text">Thank you!</div>
        </div>

    </div>

    <script>
        const NTFY_TOPIC = "uzlateho-nuzek-checkout-2026";
        let currentLang = 'en';
        let currentMode = ''; 
        let idleTimer;

        // Jazykové mutace textů
        const translations = {
            en: {
                title: "Kiosk",
                serviceBtn: "SERVICE / HELP",
                room: "Room number",
                name: "Your Name",
                desc: "Describe your issue or question",
                cancel: "CANCEL",
                submit: "SEND",
                wait: "WAIT...",
                fillAll: "Please fill in all fields.",
                errSend: "Transmission error. Please try again.",
                thanksCheckout: "Thank you! Have a safe journey home.",
                thanksService: "Thank you! We will attend to your request during business hours (8:00 - 16:00)."
            },
            cs: {
                title: "Kiosk",
                serviceBtn: "OPRAVA / DOTAZ",
                room: "Číslo pokoje",
                name: "Vaše jméno",
                desc: "Popište váš problém nebo dotaz",
                cancel: "ZRUŠIT",
                submit: "ODESLAT",
                wait: "ČEKEJTE...",
                fillAll: "Prosím vyplňte všechna pole.",
                errSend: "Chyba odesílání. Zkuste to znovu.",
                thanksCheckout: "Děkujeme! Přejeme vám šťastnou cestu domů.",
                thanksService: "Děkujeme! Vašemu požadavku se budeme věnovat v pracovní době (8:00 - 16:00)."
            },
            de: {
                title: "Kiosk",
                serviceBtn: "REPARATUR / FRAGE",
                room: "Zimmernummer",
                name: "Ihr Name",
                desc: "Beschreibung des Problems / Frage",
                cancel: "ABBRECHEN",
                submit: "SENDEN",
                wait: "WARTEN...",
                fillAll: "Bitte füllen Sie alle Felder aus.",
                errSend: "Fehler beim Senden. Versuchen Sie es erneut.",
                thanksCheckout: "Vielen Dank! Wir wünschen Ihnen eine gute Heimreise.",
                thanksService: "Vielen Dank! Wir werden uns um Ihr Anliegen während der Arbeitszeit (8:00 - 16:00) kümmern."
            },
            pl: {
                title: "Kiosk",
                serviceBtn: "NAPRAWA / PYTANIE",
                room: "Numer pokoju",
                name: "Twoje imię",
                desc: "Opisz swój problem lub pytanie",
                cancel: "ANULUJ",
                submit: "WYŚLIJ",
                wait: "CZEKAJ...",
                fillAll: "Proszę wypełnić wszystkie pola.",
                errSend: "Błąd wysyłania. Spróbuj ponownie.",
                thanksCheckout: "Dziękujemy! Życzymy bezpiecznej podróży do domu.",
                thanksService: "Dziękujemy! Rozpatrzymy Twoją prośbę w godzinach pracy (8:00 - 16:00)."
            },
            it: {
                title: "Chiosco",
                serviceBtn: "RIPARAZIONE / DOMANDA",
                room: "Numero di stanza",
                name: "Il tuo nome",
                desc: "Descrivi il tuo problema o domanda",
                cancel: "ANNULLA",
                submit: "INVIA",
                wait: "ATTENDERE...",
                fillAll: "Si prega di compilare tutti i campi.",
                errSend: "Errore di invio. Riprova.",
                thanksCheckout: "Grazie! Vi auguriamo un buon viaggio di ritorno.",
                thanksService: "Grazie! Ci occuperemo della tua richiesta durante l'orario di lavoro (8:00 - 16:00)."
            },
            fr: {
                title: "Kiosque",
                serviceBtn: "RÉPARATION / QUESTION",
                room: "Numéro de chambre",
                name: "Votre nom",
                desc: "Décrivez votre problème ou question",
                cancel: "ANNULER",
                submit: "ENVOYER",
                wait: "ATTENDEZ...",
                fillAll: "Veuillez remplir tous les champs.",
                errSend: "Erreur d'envoi. Veuillez réessayer.",
                thanksCheckout: "Merci! Bon retour chez vous.",
                thanksService: "Merci! Nous traiterons votre demande pendant les heures de bureau (8:00 - 16:00)."
            },
            uk: {
                title: "Кіоск",
                serviceBtn: "РЕМОНТ / ПИТАННЯ",
                room: "Номер кімнати",
                name: "Ваше ім'я",
                desc: "Опишіть вашу проблему або питання",
                cancel: "СКАСУВАТИ",
                submit: "ВІДПРАВИТИ",
                wait: "ЗАЧЕКАЙТЕ...",
                fillAll: "Будь ласка, заповніть усі поля.",
                errSend: "Помилка відправки. Спробуйте ще раз.",
                thanksCheckout: "Дякуємо! Бажаємо щасливої дороги додому.",
                thanksService: "Дякуємо! Ми розглянемо ваше звернення в робочий час (з 8:00 до 16:00)."
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-flag').forEach(f => f.classList.remove('active'));
            document.getElementById(`flag-${lang}`).classList.add('active');

            const t = translations[lang];
            document.getElementById('main-title').innerText = t.title;
            document.getElementById('btn-label-service').innerText = t.serviceBtn;
            document.getElementById('lbl-room').innerText = t.room;
            document.getElementById('lbl-name').innerText = t.name;
            document.getElementById('lbl-desc').innerText = t.desc;
            document.getElementById('btn-cancel').innerText = t.cancel;
            
            const submitBtn = document.getElementById('submitBtn');
            if (!submitBtn.disabled) { submitBtn.innerText = t.submit; }
            resetIdleTimer();
        }

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            if (!document.getElementById('screen-2').classList.contains('hidden')) {
                idleTimer = setTimeout(() => { resetToStart(); }, 60000); 
            }
        }

        window.onload = () => {
            const inputs = document.querySelectorAll('input, textarea');
            inputs.forEach(el => {
                el.addEventListener('input', resetIdleTimer);
                el.addEventListener('keydown', resetIdleTimer);
            });
            setLanguage('en'); 
        };

        function goToForm(mode) {
            currentMode = mode;
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-2').classList.remove('hidden');
            document.getElementById('roomInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('descInput').value = '';

            if (mode === 'checkout') {
                document.getElementById('group-name').classList.remove('hidden');
                document.getElementById('group-desc').classList.add('hidden');
            } else if (mode === 'service') {
                document.getElementById('group-name').classList.add('hidden');
                document.getElementById('group-desc').classList.remove('hidden');
            }
            document.getElementById('roomInput').focus();
            setLanguage(currentLang); 
            resetIdleTimer();
        }

        function resetToStart() {
            clearTimeout(idleTimer);
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('screen-2').classList.add('hidden');
            document.getElementById('screen-3').classList.add('hidden');
            document.getElementById('screen-1').classList.remove('hidden');
        }

        function submitForm() {
            const room = document.getElementById('roomInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const desc = document.getElementById('descInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const t = translations[currentLang];

            if (!room || (currentMode === 'checkout' && !name) || (currentMode === 'service' && !desc)) {
                alert(t.fillAll);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = t.wait;
            clearTimeout(idleTimer);
            let ntfyHeaders = { 'Priority': 'high' };
            let message = `Pokoj: ${room}\nJazyk kiosku: ${currentLang.toUpperCase()}\n`;

            if (currentMode === 'checkout') {
                ntfyHeaders['Title'] = `🔴 CHECK-OUT: Pokoj ${room}`;
                ntfyHeaders['Tags'] = 'door,red_circle';
                message += `Jméno: ${name}`;
            } else if (currentMode === 'service') {
                ntfyHeaders['Title'] = `🟡 OPRAVA / DOTAZ: Pokoj ${room}`;
                ntfyHeaders['Tags'] = 'wrench,yellow_circle';
                message += `Popis: ${desc}`;
            }

            fetch(`https://ntfy.sh{NTFY_TOPIC}`, {
                method: 'POST',
                body: message,
                headers: ntfyHeaders
            })
            .then(response => {
                if (response.ok) { showSuccess(); } else { throw new Error(); }
            })
            .catch(() => {
                alert(t.errSend);
                submitBtn.disabled = false;
                submitBtn.innerText = t.submit;
                resetIdleTimer();
            });
        }

        function showSuccess() {
            const t = translations[currentLang];
            document.getElementById('screen-2').classList.add('hidden');
            document.getElementById('screen-3').classList.remove('hidden');
            
            const iconSvg = document.getElementById('status-icon').querySelector('svg');
            if (currentMode === 'checkout') {
                iconSvg.style.fill = '#ef5350'; 
                document.getElementById('thanks-text').innerText = t.thanksCheckout;
            } else {
                iconSvg.style.fill = '#fbc02d'; 
                document.getElementById('thanks-text').innerText = t.thanksService;
            }
            setTimeout(() => { resetToStart(); }, 10000);
        }
    </script>
</body>
</html>
