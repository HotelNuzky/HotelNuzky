<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk - Check-in</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Hlavní tlačítko Check-in */
        .btn-checkin {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #28a745, #218838);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.3);
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn-checkin:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2);
        }

        /* Šipka u tlačítka posunutá o 0.5 cm doprava */
        .btn-checkin .arrow {
            margin-left: 0.5cm;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .btn-checkin:hover .arrow {
            transform: translateX(4px);
        }
    </style>
</head>
<body>

    <button class="btn-checkin" onclick="handleCheckin()">
        <span>Check-in</span>
        <span class="arrow">➔</span>
    </button>

    <script>
        function handleCheckin() {
            // Zde navazuje tvoje logika (otvírání formuláře / ntfy.sh)
            console.log("Check-in stisknut");
        }
    </script>

</body>
</html>
